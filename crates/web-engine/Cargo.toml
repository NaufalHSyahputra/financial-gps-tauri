[package]
name = "web-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core-engine = { path = "../core-engine" }
chrono = "=0.4.45"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
wasm-bindgen = "=0.2.130"
