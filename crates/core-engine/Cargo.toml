[package]
name = "core-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
rust_decimal = { version = "=1.39.0", default-features = false, features = ["std"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
base64 = "=0.22.1"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
unicode-normalization = "=0.1.25"
unicode-casefold = "=0.2.0"
sha2 = "=0.11.1"
regex = "=1.13.2"
uuid = { version = "=1.29.3", features = ["v4", "serde", "js"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
thiserror = "=2.0.21"
parking_lot = "=0.12.5"

aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
zeroize = "=1.9.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"
